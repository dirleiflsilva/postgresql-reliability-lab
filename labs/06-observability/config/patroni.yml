scope: lab06
namespace: /service/
restapi:
  listen: 0.0.0.0:8008
etcd3:
  hosts: etcd1:2379,etcd2:2379,etcd3:2379
bootstrap:
  dcs:
    ttl: 20
    loop_wait: 3
    retry_timeout: 3
    maximum_lag_on_failover: 1048576
    check_timeline: true
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        hot_standby: 'on'
        wal_log_hints: 'on'
        password_encryption: scram-sha-256
        max_wal_senders: 10
        max_replication_slots: 10
        max_slot_wal_keep_size: 1GB
        shared_preload_libraries: pg_stat_statements
        track_io_timing: 'on'
        logging_collector: 'on'
        log_destination: jsonlog
        log_directory: /var/log/postgresql
        log_filename: postgresql.json
        log_rotation_age: 0
        log_rotation_size: 0
        log_min_duration_statement: 250
        log_checkpoints: 'on'
        log_connections: 'on'
        log_disconnections: 'on'
        log_lock_waits: 'on'
        deadlock_timeout: 1s
  initdb:
    - encoding: UTF8
    - data-checksums
    - auth-local: trust
    - auth-host: scram-sha-256
  post_bootstrap: /lab/bootstrap.sh
postgresql:
  listen: 0.0.0.0:5432
  data_dir: /var/lib/postgresql/data/pgdata
  bin_dir: /usr/lib/postgresql/16/bin
  pgpass: /tmp/patroni.pgpass
  basebackup:
    checkpoint: fast
  authentication:
    superuser:
      username: postgres
    replication:
      username: replicator
  pg_hba:
    - local all all trust
    - host replication replicator all scram-sha-256
    - host all monitor_user all scram-sha-256
    - host all all all scram-sha-256

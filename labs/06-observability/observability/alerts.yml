groups:
  - name: postgresql-reliability
    rules:
      - alert: PostgreSQLExporterDown
        expr: up{job="postgres"} == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "Exporter PostgreSQL indisponível em {{ $labels.node }}"
      - alert: PostgreSQLTooManyConnections
        expr: sum by (node) (pg_stat_activity_count) > 80
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Muitas conexões PostgreSQL em {{ $labels.node }}"
      - alert: PatroniMemberDown
        expr: up{job="patroni"} == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "Membro Patroni indisponível em {{ $labels.node }}"
      - alert: PatroniLeaderMissing
        expr: sum(patroni_primary) < 1
        for: 15s
        labels: {severity: critical}
        annotations:
          summary: "Cluster Patroni sem líder observado"
      - alert: ReplicationLagHigh
        expr: (patroni_xlog_received_location - patroni_xlog_replayed_location > 16777216) and on(node) (patroni_replica == 1)
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "Replica {{ $labels.node }} atrasada em mais de 16 MiB"

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /run/promtail/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: postgresql
    static_configs:
      - targets: [localhost]
        labels:
          job: postgresql
          node: pg1
          __path__: /var/log/postgresql/pg1/*.json
      - targets: [localhost]
        labels:
          job: postgresql
          node: pg2
          __path__: /var/log/postgresql/pg2/*.json
    pipeline_stages:
      - json:
          expressions:
            severity: error_severity
            database: database_name
            user: user_name
      - labels:
          severity:
          database:
          user:

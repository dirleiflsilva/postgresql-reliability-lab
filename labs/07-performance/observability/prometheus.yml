global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter-pg1:9187]
        labels: {node: pg1}
      - targets: [postgres-exporter-pg2:9187]
        labels: {node: pg2}
  - job_name: patroni
    metrics_path: /metrics
    static_configs:
      - targets: [pg1:8008]
        labels: {node: pg1}
      - targets: [pg2:8008]
        labels: {node: pg2}
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
